<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties | SIBL Properties</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="data/properties.js?v=2"></script>
</head>
<body>

<header class="site-header">
<div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo/sibl-properties-logo.png" alt="SIBL Properties" class="site-logo"></a>

<button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>

<nav class="main-nav">
<a href="index.html">Home</a>
<a href="properties.html">Properties</a>
<a href="about.html">About Me</a>
<a href="guides.html">Guides</a>
<a href="contact.html">Contact</a>
<a href="https://wa.me/2347060988611?text=Hello%20Solomon%2C%20I%20would%20like%20to%20know%20more%20about%20your%20properties." class="whatsapp-btn" target="_blank">WhatsApp Me</a>
</nav>
</div>
</header>

<section class="section">
<div class="container">

<div class="section-heading">
<h1>Available Properties</h1>
<p>Explore current property opportunities marketed through SIBL Properties.</p>
</div>

<div class="property-mode-switch">
<button type="button" class="property-mode-btn active" data-mode="land">LAND</button>
<button type="button" class="property-mode-btn" data-mode="homes">APARTMENTS &amp; HOMES</button>
</div>

<div class="property-filters">
<select id="location-filter"><option value="">All Locations</option></select>
<select id="type-filter"><option value="">All Plot Sizes</option></select>
<select id="category-filter"><option value="">All Prices</option></select>
</div>

<div class="property-grid" id="all-properties"></div>

</div>
</section>

<footer class="site-footer">
<div class="container">
<p>© 2026 SIBL Properties. Property Opportunities. Personal Guidance.</p>
</div>
</footer>

<script>
const propertyContainer = document.querySelector("#all-properties");
const locationFilter = document.querySelector("#location-filter");
const typeFilter = document.querySelector("#type-filter");
const categoryFilter = document.querySelector("#category-filter");
const modeButtons = document.querySelectorAll(".property-mode-btn");

let currentMode = "land";

function getLocations(list) {
    return [...new Set(list.map(property => property.location).filter(Boolean))].sort();
}

function getPlotSizes(list) {
    const sizes = [];
    list.forEach(property => {
        (property.options || []).forEach(option => {
            if (option.plotSize && !sizes.includes(option.plotSize)) {
                sizes.push(option.plotSize);
            }
        });
    });
    return sizes.sort();
}

function getPropertyTypes(list) {
    const types = [];
    list.forEach(property => {
        (property.options || []).forEach(option => {
            if (option.propertyType && !types.includes(option.propertyType)) {
                types.push(option.propertyType);
            }
        });
    });
    return types.sort();
}

function getBedrooms(list) {
    const bedrooms = [];
    list.forEach(property => {
        (property.options || []).forEach(option => {
            if (option.bedrooms && !bedrooms.includes(option.bedrooms)) {
                bedrooms.push(option.bedrooms);
            }
        });
    });
    return bedrooms.sort();
}

function getPrices(list) {
    const prices = [];
    list.forEach(property => {
        (property.options || []).forEach(option => {
            if (option.price && !prices.includes(option.price)) {
                prices.push(option.price);
            }
        });
    });
    return prices;
}

function fillFilter(select, values, formatter) {
    select.innerHTML = "";
    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = select === locationFilter
        ? "All Locations"
        : currentMode === "land"
            ? (select === typeFilter ? "All Plot Sizes" : "All Prices")
            : (select === typeFilter ? "All Property Types" : "All Bedrooms");
    select.appendChild(defaultOption);

    values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = formatter ? formatter(value) : value;
        select.appendChild(option);
    });
}

function getModeProperties() {
    return properties.filter(property => {
        const options = property.options || [];
        return currentMode === "land"
            ? options.some(option => option.plotSize)
            : options.some(option => option.bedrooms);
    });
}

function setupFilters() {
    const list = getModeProperties();

    fillFilter(locationFilter, getLocations(list));
    
    if (currentMode === "land") {
        fillFilter(typeFilter, getPlotSizes(list));
        fillFilter(categoryFilter, getPrices(list), value => value);
    } else {
        fillFilter(typeFilter, getPropertyTypes(list));
        fillFilter(categoryFilter, getBedrooms(list));
    }
}

function matchesFilters(property) {
    const options = property.options || [];
    const location = locationFilter.value;
    const filterTwo = typeFilter.value;
    const filterThree = categoryFilter.value;

    if (location && property.location !== location) return false;

    if (currentMode === "land") {
        return options.some(option =>
            option.plotSize === filterTwo || !filterTwo
        ) && options.some(option =>
            option.price === filterThree || !filterThree
        );
    }

    return options.some(option =>
        (!filterTwo || option.propertyType === filterTwo) &&
        (!filterThree || option.bedrooms === filterThree)
    );
}

function getCardOption(property) {
    const options = property.options || [];

    if (currentMode === "land") {
        return options.find(option =>
            (!typeFilter.value || option.plotSize === typeFilter.value) &&
            (!categoryFilter.value || option.price === categoryFilter.value)
        ) || options.find(option => option.plotSize) || options[0];
    }

    return options.find(option =>
        (!typeFilter.value || option.propertyType === typeFilter.value) &&
        (!categoryFilter.value || option.bedrooms === categoryFilter.value)
    ) || options.find(option => option.bedrooms) || options[0];
}

function renderProperties() {
    const filtered = getModeProperties().filter(matchesFilters);

    if (!filtered.length) {
        propertyContainer.innerHTML = "<p>No properties match your selected filters.</p>";
        return;
    }

    propertyContainer.innerHTML = filtered.map(property => {
        const option = getCardOption(property) || {};
        const image = currentMode === "homes" && property.id === "carlton-residences" ? "<img src=\"images/properties/carlton-3br-home-enhanced.jpg\" alt=\"" + property.name + "\">" : property.images && property.images.length
            ? `<img src="${property.images[0]}" alt="${property.name}">`
            : "Property Image";

        const duration = option.duration || "Please confirm";

        if (currentMode === "land") {
            return `
            <article class="property-card">
                <div class="property-image">${image}</div>
                <div class="property-body">
                    <h3>${property.name}</h3>
                    <div class="property-location">${property.location}</div>
                    <p class="property-types"><strong>Plot Size:</strong> ${option.plotSize || "Please confirm"}</p>
                    <p class="property-types"><strong>Prototype:</strong> ${option.propertyType || "Please confirm"}</p>
                    <div class="property-price">${option.price || "Price on request"}</div>
                    <p class="property-types"><strong>Duration:</strong> ${duration}</p>
                    <a href="property.html?id=${property.id}" class="btn btn-outline-dark">View Property</a>
                    <a href="https://wa.me/2347060988611?text=Hello%20Solomon%2C%20I%20am%20interested%20in%20${encodeURIComponent(property.name)}." class="btn btn-gold" target="_blank">Enquire on WhatsApp</a>
                </div>
            </article>`;
        }

        return `
        <article class="property-card">
            <div class="property-image">${image}</div>
            <div class="property-body">
                <h3>${property.name}</h3>
                <div class="property-location">${property.location}</div>
                <p class="property-types"><strong>Property Type:</strong> ${option.propertyType || "Please confirm"}</p>
                <p class="property-types"><strong>Bedrooms:</strong> ${option.bedrooms || "Please confirm"}</p>
                <div class="property-price">${option.price || "Price on request"}</div>
                <p class="property-types"><strong>Duration:</strong> ${duration}</p>
                <a href="property.html?id=${property.id}" class="btn btn-outline-dark">View Property</a>
                <a href="https://wa.me/2347060988611?text=Hello%20Solomon%2C%20I%20am%20interested%20in%20${encodeURIComponent(property.name)}." class="btn btn-gold" target="_blank">Enquire on WhatsApp</a>
            </div>
        </article>`;
    }).join("");
}

modeButtons.forEach(button => {
    button.addEventListener("click", function() {
        currentMode = this.dataset.mode;

        modeButtons.forEach(btn => btn.classList.remove("active"));
        this.classList.add("active");

        locationFilter.value = "";
        typeFilter.value = "";
        categoryFilter.value = "";

        setupFilters();
        renderProperties();
    });
});

locationFilter.addEventListener("change", renderProperties);
typeFilter.addEventListener("change", renderProperties);
categoryFilter.addEventListener("change", renderProperties);

setupFilters();
renderProperties();
</script>

<script>
const menuToggle=document.querySelector(".menu-toggle");
const mainNav=document.querySelector(".main-nav");

if(menuToggle&&mainNav){
menuToggle.addEventListener("click",function(){
mainNav.classList.toggle("menu-open");
const isOpen=mainNav.classList.contains("menu-open");
menuToggle.setAttribute("aria-expanded",isOpen);
menuToggle.textContent=isOpen?"✕":"☰";
});
}
</script>

</body>
</html>
